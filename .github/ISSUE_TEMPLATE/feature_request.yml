name: Feature / task
description: A unit of work small enough for one pull request
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Who needs this and why.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Given / When / Then, one per line.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test notes
      description: Which tests prove it (unit, API, e2e).
  - type: input
    id: notion
    attributes:
      label: Notion task URL
  - type: input
    id: figma
    attributes:
      label: Figma node URL
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: ["S (< half a day)", "M (1-2 days)", "L (split it)"]
